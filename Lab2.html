    <p>첫 방문시에만 알림창 띄우기</p>

<script>
    console.log("현재페이지 경로 : ", location.pathname);

    if(!localStorage.getItem("hasVisited")){
        alert("환영합니다! 처음 방문해주셨네요 😊");
        localStorage.setItem("hasVisited", true);
    }
    else{
        console.log("이미 방문한 사용자입니다.");
    }
</script>
